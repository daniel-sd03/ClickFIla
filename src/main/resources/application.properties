# ==========================================
# 1. SERVER & REVERSE PROXY (CLOUDFLARE)
# ==========================================
server.servlet.context-path=/api
server.forward-headers-strategy=framework
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto

# ==========================================
# 2. DATABASE
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# ==========================================
# 3. LOCALIZATION
# ==========================================
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==========================================
# 4. SECURITY & AUTH (JWT & OAUTH2)
# ==========================================
api.security.token.secret=${JWT_SECRET}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# ==========================================
# 5. SECURITY - REDIRECTS & COOKIES
# ==========================================
app.security.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.security.oauth2-redirect=${app.security.frontend-url}/oauth/callback
app.security.cookie.domain=${COOKIE_DOMAIN:}
app.security.cookie.secure=${COOKIE_SECURE:false}

# ==========================================
# 6. CACHE
# ==========================================
spring.cache.type=${SPRING_CACHE_TYPE}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

# ==========================================
# 7. EMAIL (RESEND)
# ==========================================
spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY}
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM}

# ==========================================
# 8. WEB PUSH NOTIFICATIONS
# ==========================================
webpush.vapid.public.key=${VAPID_PUBLIC_KEY}
webpush.vapid.private.key=${VAPID_PRIVATE_KEY}
webpush.vapid.subject=${VAPID_SUBJECT:mailto:suporte@clickfila.com}

# ==========================================
# 9. OBSERVABILITY & METRICS (GRAFANA)
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=clickFila-api

# ==========================================
# 10. COMPLIANCE (LGPD)
# ==========================================
app.lgpd.current-version=1.0

# ==========================================
# 11. PERFORMANCE (JAVA 21)
# ==========================================
spring.threads.virtual.enabled=true

# ==========================================
# 12. BILLING & PAYMENT GATEWAY (ASAAS)
# ==========================================
asaas.api.url=${ASAAS_API_URL}
asaas.api.key=${ASAAS_API_KEY}
asaas.webhook.token=${ASAAS_WEBHOOK_TOKEN}
billing.trial.days=7
billing.grace.period.days=5
billing.cancellation.days=15

# ==========================================
# 13. PRODUCTION SECURITY DEFAULTS
# ==========================================
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}